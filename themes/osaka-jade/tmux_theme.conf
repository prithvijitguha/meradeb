# vim:set ft=tmux:
# --> Osaka Jade (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/osaka-jade/zellij.kdl

# Palette
set -ogq @thm_bg      "#111c18"
set -ogq @thm_fg      "#C1C497"
set -ogq @thm_black   "#23372B"
set -ogq @thm_red     "#FF5345"
set -ogq @thm_green   "#549e6a"
set -ogq @thm_yellow  "#459451"
set -ogq @thm_blue    "#509475"
set -ogq @thm_magenta "#D2689C"
set -ogq @thm_orange  "#E5C736"
set -ogq @thm_cyan    "#2DD5B7"
set -ogq @thm_white   "#F6F5DD"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#111c18,fg=#C1C497"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#509475,fg=#111c18,bold] #S #[bg=#111c18,fg=#509475,nobold]"

# Right: host + date/time
set -g status-right-length 60
set -g status-right "#[fg=#23372B,bg=#111c18]#[bg=#23372B,fg=#C1C497] %Y-%m-%d  %H:%M #[fg=#509475,bg=#23372B]#[bg=#509475,fg=#111c18,bold] #h "

# Window list
set -g window-status-format "#[fg=#C1C497,bg=#111c18] #I:#W "
set -g window-status-current-format "#[fg=#111c18,bg=#E5C736,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#459451,bg=#111c18"
set -g window-status-bell-style "fg=#FF5345,bg=#111c18,bold"

# Pane borders
set -g pane-border-style "fg=#23372B"
set -g pane-active-border-style "fg=#509475"

# Messages / command line
set -g message-style "bg=#459451,fg=#111c18,bold"
set -g message-command-style "bg=#23372B,fg=#C1C497"

# Copy mode / selection
set -g mode-style "bg=#D2689C,fg=#111c18"

# Clock mode
set -g clock-mode-colour "#509475"
set -g clock-mode-style 24

# Pane number display (prefix + q)
set -g display-panes-active-colour "#E5C736"
set -g display-panes-colour "#509475"
