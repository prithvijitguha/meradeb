# vim:set ft=tmux:
# --> Ristretto (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/ristretto/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/ristretto/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#2c2525"
set -ogq @thm_fg      "#e6d9db"
set -ogq @thm_black   "#2c2525"
set -ogq @thm_red     "#fd6883"
set -ogq @thm_green   "#adda78"
set -ogq @thm_yellow  "#f9cc6c"
set -ogq @thm_blue    "#f38d70"
set -ogq @thm_magenta "#a8a9eb"
set -ogq @thm_orange  "#FFA066"
set -ogq @thm_cyan    "#85dacc"
set -ogq @thm_white   "#e6d9db"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2c2525,fg=#e6d9db"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#2c2525,bg=#f38d70,bold]  #S #[fg=#f38d70,bg=#2c2525]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#e6d9db,bg=#2c2525] #I:#W "
set -g window-status-current-format "#[fg=#2c2525,bg=#FFA066,bold] #I:#W #[fg=#FFA066,bg=#2c2525]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#f9cc6c,bg=#2c2525"
set -g window-status-bell-style "fg=#fd6883,bg=#2c2525,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#2c2525,bg=#2c2525]#[fg=#e6d9db,bg=#2c2525] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#a8a9eb,bg=#2c2525]#[fg=#2c2525,bg=#a8a9eb,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#85dacc,bg=#a8a9eb]#[fg=#2c2525,bg=#85dacc,bold]  %H:%M #[fg=#FFA066,bg=#85dacc]#[fg=#2c2525,bg=#FFA066,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#2c2525"
set -g pane-active-border-style "fg=#f38d70"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#f9cc6c,fg=#2c2525,bold"
set -g message-command-style "bg=#2c2525,fg=#e6d9db"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#a8a9eb,fg=#2c2525"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#f38d70"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#FFA066"
set -g display-panes-colour "#f38d70"
