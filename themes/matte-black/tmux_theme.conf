# vim:set ft=tmux:
# --> Matte Black (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/matte-black/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/matte-black/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#121212"
set -ogq @thm_fg      "#bebebe"
set -ogq @thm_black   "#333333"
set -ogq @thm_red     "#D35F5F"
set -ogq @thm_green   "#FFC107"
set -ogq @thm_yellow  "#b91c1c"
set -ogq @thm_blue    "#e68e0d"
set -ogq @thm_magenta "#D35F5F"
set -ogq @thm_orange  "#FFA066"
set -ogq @thm_cyan    "#bebebe"
set -ogq @thm_white   "#bebebe"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#121212,fg=#bebebe"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#121212,bg=#e68e0d,bold]  #S #[fg=#e68e0d,bg=#121212]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#bebebe,bg=#121212] #I:#W "
set -g window-status-current-format "#[fg=#121212,bg=#FFA066,bold] #I:#W #[fg=#FFA066,bg=#121212]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#b91c1c,bg=#121212"
set -g window-status-bell-style "fg=#D35F5F,bg=#121212,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#333333,bg=#121212]#[fg=#bebebe,bg=#333333] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#D35F5F,bg=#333333]#[fg=#121212,bg=#D35F5F,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#bebebe,bg=#D35F5F]#[fg=#121212,bg=#bebebe,bold]  %H:%M #[fg=#FFA066,bg=#bebebe]#[fg=#121212,bg=#FFA066,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#e68e0d"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#b91c1c,fg=#121212,bold"
set -g message-command-style "bg=#333333,fg=#bebebe"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#D35F5F,fg=#121212"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#e68e0d"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#FFA066"
set -g display-panes-colour "#e68e0d"
