# vim:set ft=tmux:
# --> Everforest (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/everforest/zellij.kdl

# Palette
set -ogq @thm_bg      "#2b3339"
set -ogq @thm_fg      "#d3c6aa"
set -ogq @thm_black   "#4b565c"
set -ogq @thm_red     "#e67e80"
set -ogq @thm_green   "#a7c080"
set -ogq @thm_yellow  "#dbbc7f"
set -ogq @thm_blue    "#7fbbb3"
set -ogq @thm_magenta "#d699b6"
set -ogq @thm_orange  "#FF9E64"
set -ogq @thm_cyan    "#83c092"
set -ogq @thm_white   "#d3c6aa"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2b3339,fg=#d3c6aa"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#7fbbb3,fg=#2b3339,bold] #S #[bg=#2b3339,fg=#7fbbb3,nobold]"

# Right: host + date/time
set -g status-right-length 60
set -g status-right "#[fg=#4b565c,bg=#2b3339]#[bg=#4b565c,fg=#d3c6aa] %Y-%m-%d  %H:%M #[fg=#7fbbb3,bg=#4b565c]#[bg=#7fbbb3,fg=#2b3339,bold] #h "

# Window list
set -g window-status-format "#[fg=#d3c6aa,bg=#2b3339] #I:#W "
set -g window-status-current-format "#[fg=#2b3339,bg=#FF9E64,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#dbbc7f,bg=#2b3339"
set -g window-status-bell-style "fg=#e67e80,bg=#2b3339,bold"

# Pane borders
set -g pane-border-style "fg=#4b565c"
set -g pane-active-border-style "fg=#7fbbb3"

# Messages / command line
set -g message-style "bg=#dbbc7f,fg=#2b3339,bold"
set -g message-command-style "bg=#4b565c,fg=#d3c6aa"

# Copy mode / selection
set -g mode-style "bg=#d699b6,fg=#2b3339"

# Clock mode
set -g clock-mode-colour "#7fbbb3"
set -g clock-mode-style 24

# Pane number display (prefix + q)
set -g display-panes-active-colour "#FF9E64"
set -g display-panes-colour "#7fbbb3"
