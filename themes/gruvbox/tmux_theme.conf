# vim:set ft=tmux:
# --> Gruvbox (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/gruvbox/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/gruvbox/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#282828"
set -ogq @thm_fg      "#d5c4a1"
set -ogq @thm_black   "#3c3836"
set -ogq @thm_red     "#cc241d"
set -ogq @thm_green   "#98971a"
set -ogq @thm_yellow  "#d79921"
set -ogq @thm_blue    "#3c8588"
set -ogq @thm_magenta "#b16286"
set -ogq @thm_orange  "#d65d0e"
set -ogq @thm_cyan    "#689d6a"
set -ogq @thm_white   "#fbf1c7"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282828,fg=#d5c4a1"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#282828,bg=#3c8588,bold]  #S #[fg=#3c8588,bg=#282828]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#d5c4a1,bg=#282828] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#d65d0e,bold] #I:#W #[fg=#d65d0e,bg=#282828]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#d79921,bg=#282828"
set -g window-status-bell-style "fg=#cc241d,bg=#282828,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#3c3836,bg=#282828]#[fg=#d5c4a1,bg=#3c3836] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#b16286,bg=#3c3836]#[fg=#282828,bg=#b16286,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#689d6a,bg=#b16286]#[fg=#282828,bg=#689d6a,bold]  %H:%M #[fg=#d65d0e,bg=#689d6a]#[fg=#282828,bg=#d65d0e,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#3c8588"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#d79921,fg=#282828,bold"
set -g message-command-style "bg=#3c3836,fg=#d5c4a1"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#b16286,fg=#282828"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#3c8588"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#d65d0e"
set -g display-panes-colour "#3c8588"
