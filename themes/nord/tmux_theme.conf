# vim:set ft=tmux:
# --> Nord (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/nord/zellij.kdl

# Palette
set -ogq @thm_bg      "#2E3440"
set -ogq @thm_fg      "#D8DEE9"
set -ogq @thm_black   "#3B4252"
set -ogq @thm_red     "#BF616A"
set -ogq @thm_green   "#A3BE8C"
set -ogq @thm_yellow  "#EBCB8B"
set -ogq @thm_blue    "#81A1C1"
set -ogq @thm_magenta "#B48EAD"
set -ogq @thm_orange  "#D08770"
set -ogq @thm_cyan    "#88C0D0"
set -ogq @thm_white   "#E5E9F0"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2E3440,fg=#D8DEE9"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#81A1C1,fg=#2E3440,bold] #S #[bg=#2E3440,fg=#81A1C1,nobold]"

# Right: host + date/time
set -g status-right-length 60
set -g status-right "#[fg=#3B4252,bg=#2E3440]#[bg=#3B4252,fg=#D8DEE9] %Y-%m-%d  %H:%M #[fg=#81A1C1,bg=#3B4252]#[bg=#81A1C1,fg=#2E3440,bold] #h "

# Window list
set -g window-status-format "#[fg=#D8DEE9,bg=#2E3440] #I:#W "
set -g window-status-current-format "#[fg=#2E3440,bg=#D08770,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#EBCB8B,bg=#2E3440"
set -g window-status-bell-style "fg=#BF616A,bg=#2E3440,bold"

# Pane borders
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#81A1C1"

# Messages / command line
set -g message-style "bg=#EBCB8B,fg=#2E3440,bold"
set -g message-command-style "bg=#3B4252,fg=#D8DEE9"

# Copy mode / selection
set -g mode-style "bg=#B48EAD,fg=#2E3440"

# Clock mode
set -g clock-mode-colour "#81A1C1"
set -g clock-mode-style 24

# Pane number display (prefix + q)
set -g display-panes-active-colour "#D08770"
set -g display-panes-colour "#81A1C1"
