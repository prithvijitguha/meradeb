# vim:set ft=tmux:
# --> Kanagawa (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/kanagawa/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/kanagawa/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#1F1F28"
set -ogq @thm_fg      "#DCD7BA"
set -ogq @thm_black   "#16161D"
set -ogq @thm_red     "#C34043"
set -ogq @thm_green   "#76946A"
set -ogq @thm_yellow  "#FF9E3B"
set -ogq @thm_blue    "#7E9CD8"
set -ogq @thm_magenta "#957FB8"
set -ogq @thm_orange  "#FFA066"
set -ogq @thm_cyan    "#7FB4CA"
set -ogq @thm_white   "#DCD7BA"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1F1F28,fg=#DCD7BA"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#1F1F28,bg=#7E9CD8,bold]  #S #[fg=#7E9CD8,bg=#1F1F28]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#DCD7BA,bg=#1F1F28] #I:#W "
set -g window-status-current-format "#[fg=#1F1F28,bg=#FFA066,bold] #I:#W #[fg=#FFA066,bg=#1F1F28]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#FF9E3B,bg=#1F1F28"
set -g window-status-bell-style "fg=#C34043,bg=#1F1F28,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#16161D,bg=#1F1F28]#[fg=#DCD7BA,bg=#16161D] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#957FB8,bg=#16161D]#[fg=#1F1F28,bg=#957FB8,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#7FB4CA,bg=#957FB8]#[fg=#1F1F28,bg=#7FB4CA,bold]  %H:%M #[fg=#FFA066,bg=#7FB4CA]#[fg=#1F1F28,bg=#FFA066,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#16161D"
set -g pane-active-border-style "fg=#7E9CD8"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#FF9E3B,fg=#1F1F28,bold"
set -g message-command-style "bg=#16161D,fg=#DCD7BA"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#957FB8,fg=#1F1F28"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#7E9CD8"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#FFA066"
set -g display-panes-colour "#7E9CD8"
