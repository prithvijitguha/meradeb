# vim:set ft=tmux:
# --> Tokyo Night (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/tokyo-night/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/tokyo-night/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#1a1b26"
set -ogq @thm_fg      "#a9b1d6"
set -ogq @thm_black   "#383e5a"
set -ogq @thm_red     "#f93357"
set -ogq @thm_green   "#9ece6a"
set -ogq @thm_yellow  "#e0af68"
set -ogq @thm_blue    "#7aa2f7"
set -ogq @thm_magenta "#bb9af7"
set -ogq @thm_orange  "#ff9e64"
set -ogq @thm_cyan    "#2ac3de"
set -ogq @thm_white   "#c0caf5"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#a9b1d6,bg=#1a1b26] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#ff9e64,bold] #I:#W #[fg=#ff9e64,bg=#1a1b26]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#e0af68,bg=#1a1b26"
set -g window-status-bell-style "fg=#f93357,bg=#1a1b26,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#383e5a,bg=#1a1b26]#[fg=#a9b1d6,bg=#383e5a] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#bb9af7,bg=#383e5a]#[fg=#1a1b26,bg=#bb9af7,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#2ac3de,bg=#bb9af7]#[fg=#1a1b26,bg=#2ac3de,bold]  %H:%M #[fg=#ff9e64,bg=#2ac3de]#[fg=#1a1b26,bg=#ff9e64,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#383e5a"
set -g pane-active-border-style "fg=#7aa2f7"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#e0af68,fg=#1a1b26,bold"
set -g message-command-style "bg=#383e5a,fg=#a9b1d6"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#bb9af7,fg=#1a1b26"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#ff9e64"
set -g display-panes-colour "#7aa2f7"
