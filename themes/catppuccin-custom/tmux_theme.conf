# vim:set ft=tmux:
# --> Catppuccin (Mocha) (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/catppuccin/zellij.kdl

# Palette
set -ogq @thm_bg      "#585b70"
set -ogq @thm_fg      "#cdd6f4"
set -ogq @thm_black   "#181825"
set -ogq @thm_red     "#f38ba8"
set -ogq @thm_green   "#a6e3a1"
set -ogq @thm_yellow  "#f9e2af"
set -ogq @thm_blue    "#89b4fa"
set -ogq @thm_magenta "#f5c2e7"
set -ogq @thm_orange  "#fab387"
set -ogq @thm_cyan    "#89dceb"
set -ogq @thm_white   "#cdd6f4"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#585b70,fg=#cdd6f4"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#585b70,bold] #S #[bg=#585b70,fg=#89b4fa,nobold]"

# Right: host + date/time
set -g status-right-length 60
set -g status-right "#[fg=#181825,bg=#585b70]#[bg=#181825,fg=#cdd6f4] %Y-%m-%d  %H:%M #[fg=#89b4fa,bg=#181825]#[bg=#89b4fa,fg=#585b70,bold] #h "

# Window list
set -g window-status-format "#[fg=#cdd6f4,bg=#585b70] #I:#W "
set -g window-status-current-format "#[fg=#585b70,bg=#fab387,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#f9e2af,bg=#585b70"
set -g window-status-bell-style "fg=#f38ba8,bg=#585b70,bold"

# Pane borders
set -g pane-border-style "fg=#181825"
set -g pane-active-border-style "fg=#89b4fa"

# Messages / command line
set -g message-style "bg=#f9e2af,fg=#585b70,bold"
set -g message-command-style "bg=#181825,fg=#cdd6f4"

# Copy mode / selection
set -g mode-style "bg=#f5c2e7,fg=#585b70"

# Clock mode
set -g clock-mode-colour "#89b4fa"
set -g clock-mode-style 24

# Pane number display (prefix + q)
set -g display-panes-active-colour "#fab387"
set -g display-panes-colour "#89b4fa"
