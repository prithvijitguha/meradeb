# vim:set ft=tmux:
# --> Catppuccin (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/catppuccin/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/catppuccin/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#626880"
set -ogq @thm_fg      "#c6d0f5"
set -ogq @thm_black   "#292c3c"
set -ogq @thm_red     "#e78284"
set -ogq @thm_green   "#a6d189"
set -ogq @thm_yellow  "#e5c890"
set -ogq @thm_blue    "#8caaee"
set -ogq @thm_magenta "#f4b8e4"
set -ogq @thm_orange  "#ef9f76"
set -ogq @thm_cyan    "#99d1db"
set -ogq @thm_white   "#c6d0f5"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#626880,fg=#c6d0f5"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#626880,bg=#8caaee,bold]  #S #[fg=#8caaee,bg=#626880]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#c6d0f5,bg=#626880] #I:#W "
set -g window-status-current-format "#[fg=#626880,bg=#ef9f76,bold] #I:#W #[fg=#ef9f76,bg=#626880]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#e5c890,bg=#626880"
set -g window-status-bell-style "fg=#e78284,bg=#626880,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#292c3c,bg=#626880]#[fg=#c6d0f5,bg=#292c3c] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#f4b8e4,bg=#292c3c]#[fg=#626880,bg=#f4b8e4,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#99d1db,bg=#f4b8e4]#[fg=#626880,bg=#99d1db,bold]  %H:%M #[fg=#ef9f76,bg=#99d1db]#[fg=#626880,bg=#ef9f76,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#292c3c"
set -g pane-active-border-style "fg=#8caaee"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#e5c890,fg=#626880,bold"
set -g message-command-style "bg=#292c3c,fg=#c6d0f5"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#f4b8e4,fg=#626880"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#8caaee"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#ef9f76"
set -g display-panes-colour "#8caaee"
