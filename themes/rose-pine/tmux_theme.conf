# vim:set ft=tmux:
# --> Rose Pine (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/rose-pine/zellij.kdl
#
# Powerline-style status line (same shape as dracula/tmux's segmented bar):
# session chip -> window list -> [cpu][ram][time][network] chips, right-aligned.
# Requires a Nerd Font / Powerline-patched font in your terminal for the
# separator glyphs (U+E0B0) to render as solid triangles.
#
# Copied to ~/.config/tmux/theme.conf by theme.sh and sourced from
# ~/.tmux.conf. Edit the source in $OMADEB_PATH/themes/rose-pine/tmux_theme.conf.

# Palette
set -ogq @thm_bg      "#faf4ed"
set -ogq @thm_fg      "#575279"
set -ogq @thm_black   "#f2e9e1"
set -ogq @thm_red     "#b4637a"
set -ogq @thm_green   "#286983"
set -ogq @thm_yellow  "#ea9d34"
set -ogq @thm_blue    "#56949f"
set -ogq @thm_magenta "#907aa9"
set -ogq @thm_orange  "#fe640b"
set -ogq @thm_cyan    "#d7827e"
set -ogq @thm_white   "#575279"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#faf4ed,fg=#575279"

# --- Left: session chip -----------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#faf4ed,bg=#56949f,bold]  #S #[fg=#56949f,bg=#faf4ed]"

# --- Window list ---------------------------------------------------------
set -g window-status-format "#[fg=#575279,bg=#faf4ed] #I:#W "
set -g window-status-current-format "#[fg=#faf4ed,bg=#fe640b,bold] #I:#W #[fg=#fe640b,bg=#faf4ed]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#ea9d34,bg=#faf4ed"
set -g window-status-bell-style "fg=#b4637a,bg=#faf4ed,bold"

# --- Right: cpu / ram / time / network chips (dracula @dracula-plugins order) ---
set -g status-right-length 100
set -g status-right "#[fg=#f2e9e1,bg=#faf4ed]#[fg=#575279,bg=#f2e9e1] CPU #(cut -d ' ' -f1 /proc/loadavg) #[fg=#907aa9,bg=#f2e9e1]#[fg=#faf4ed,bg=#907aa9,bold] RAM #(free -h 2>/dev/null | awk '/^Mem/ {print $3"/"$2}') #[fg=#d7827e,bg=#907aa9]#[fg=#faf4ed,bg=#d7827e,bold]  %H:%M #[fg=#fe640b,bg=#d7827e]#[fg=#faf4ed,bg=#fe640b,bold]  #(hostname -I 2>/dev/null | awk '{print $1}') "

# --- Pane borders ----------------------------------------------------------
set -g pane-border-style "fg=#f2e9e1"
set -g pane-active-border-style "fg=#56949f"

# --- Messages / command line ---------------------------------------------
set -g message-style "bg=#ea9d34,fg=#faf4ed,bold"
set -g message-command-style "bg=#f2e9e1,fg=#575279"

# --- Copy mode / selection -------------------------------------------------
set -g mode-style "bg=#907aa9,fg=#faf4ed"

# --- Clock mode --------------------------------------------------------
set -g clock-mode-colour "#56949f"
set -g clock-mode-style 24

# --- Pane number display (prefix + q) --------------------------------------
set -g display-panes-active-colour "#fe640b"
set -g display-panes-colour "#56949f"
