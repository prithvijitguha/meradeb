# vim:set ft=tmux:
# --> Catppuccin (Latte) (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/catppuccin/zellij.kdl

# Palette
set -ogq @thm_bg      "#acb0be"
set -ogq @thm_fg      "#4c4f69"
set -ogq @thm_black   "#dce0e8"
set -ogq @thm_red     "#d20f39"
set -ogq @thm_green   "#40a02b"
set -ogq @thm_yellow  "#df8e1d"
set -ogq @thm_blue    "#1e66f5"
set -ogq @thm_magenta "#ea76cb"
set -ogq @thm_orange  "#fe640b"
set -ogq @thm_cyan    "#04a5e5"
set -ogq @thm_white   "#4c4f69"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#acb0be,fg=#4c4f69"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#1e66f5,fg=#acb0be,bold] #S #[bg=#acb0be,fg=#1e66f5,nobold]"

# Right: host + date/time
set -g status-right-length 60
set -g status-right "#[fg=#dce0e8,bg=#acb0be]#[bg=#dce0e8,fg=#4c4f69] %Y-%m-%d  %H:%M #[fg=#1e66f5,bg=#dce0e8]#[bg=#1e66f5,fg=#acb0be,bold] #h "

# Window list
set -g window-status-format "#[fg=#4c4f69,bg=#acb0be] #I:#W "
set -g window-status-current-format "#[fg=#acb0be,bg=#fe640b,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#df8e1d,bg=#acb0be"
set -g window-status-bell-style "fg=#d20f39,bg=#acb0be,bold"

# Pane borders
set -g pane-border-style "fg=#dce0e8"
set -g pane-active-border-style "fg=#1e66f5"

# Messages / command line
set -g message-style "bg=#df8e1d,fg=#acb0be,bold"
set -g message-command-style "bg=#dce0e8,fg=#4c4f69"

# Copy mode / selection
set -g mode-style "bg=#ea76cb,fg=#acb0be"

# Clock mode
set -g clock-mode-colour "#1e66f5"
set -g clock-mode-style 24

# Pane number display (prefix + q)
set -g display-panes-active-colour "#fe640b"
set -g display-panes-colour "#1e66f5"
