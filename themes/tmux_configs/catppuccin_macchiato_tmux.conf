# vim:set ft=tmux:
# --> Catppuccin (Macchiato) (converted from omadeb zellij.kdl)
# https://github.com/prithvijitguha/omadeb/blob/master/themes/catppuccin/zellij.kdl

# Palette
set -ogq @thm_bg      "#5b6078"
set -ogq @thm_fg      "#cad3f5"
set -ogq @thm_black   "#1e2030"
set -ogq @thm_red     "#ed8796"
set -ogq @thm_green   "#a6da95"
set -ogq @thm_yellow  "#eed49f"
set -ogq @thm_blue    "#8aadf4"
set -ogq @thm_magenta "#f5bde6"
set -ogq @thm_orange  "#f5a97f"
set -ogq @thm_cyan    "#91d7e3"
set -ogq @thm_white   "#cad3f5"

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#5b6078,fg=#cad3f5"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#8aadf4,fg=#5b6078,bold] #S #[bg=#5b6078,fg=#8aadf4,nobold]"

# Right: host + date/time
set -g status-right-length 60
set -g status-right "#[fg=#1e2030,bg=#5b6078]#[bg=#1e2030,fg=#cad3f5] %Y-%m-%d  %H:%M #[fg=#8aadf4,bg=#1e2030]#[bg=#8aadf4,fg=#5b6078,bold] #h "

# Window list
set -g window-status-format "#[fg=#cad3f5,bg=#5b6078] #I:#W "
set -g window-status-current-format "#[fg=#5b6078,bg=#f5a97f,bold] #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#eed49f,bg=#5b6078"
set -g window-status-bell-style "fg=#ed8796,bg=#5b6078,bold"

# Pane borders
set -g pane-border-style "fg=#1e2030"
set -g pane-active-border-style "fg=#8aadf4"

# Messages / command line
set -g message-style "bg=#eed49f,fg=#5b6078,bold"
set -g message-command-style "bg=#1e2030,fg=#cad3f5"

# Copy mode / selection
set -g mode-style "bg=#f5bde6,fg=#5b6078"

# Clock mode
set -g clock-mode-colour "#8aadf4"
set -g clock-mode-style 24

# Pane number display (prefix + q)
set -g display-panes-active-colour "#f5a97f"
set -g display-panes-colour "#8aadf4"
